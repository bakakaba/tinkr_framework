[package]
name = "tinkr_framework"
edition.workspace = true
version.workspace = true
description = "Framework for building APIs: multiplexed HTTP + gRPC serving on a single port, with bootstrap and logging."
readme.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tinkr_framework"

[lints]
workspace = true

[features]
default = ["grpc", "otel"]
grpc = ["dep:tonic", "dep:tower", "dep:http", "dep:tonic-reflection"]
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:http",
    "dep:http-body",
]

[dependencies]
tinkr_config = { path = "../tinkr_config", version = "0.1.11" }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "sync",
    "time",
] }
thiserror = { workspace = true }
socket2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
] }
ulid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

axum = { workspace = true, features = ["http2", "json"] }
tonic = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }

tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = [
    "grpc-tonic",
    "trace",
    "metrics",
    "logs",
    "tls-ring",
    "tls-roots",
] }
opentelemetry-appender-tracing = { workspace = true, optional = true }

[dev-dependencies]
libc = { workspace = true }
tower = { workspace = true, features = ["util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
